# Local development only. Never link this working directory to a hosted project.
project_id = "finpill-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "3m"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[studio]
enabled = false

[analytics]
enabled = false

# Development Clerk instance. Hosted staging must configure the same integration
# through Supabase Third-Party Auth before accepting Clerk session tokens.
[auth.third_party.clerk]
enabled = true
domain = "ample-chicken-233.clerk.accounts.dev"

# Exact source bodies (A05). Private; written and read only with machine authority
# under content-addressed keys. Production creates the same bucket (see A05).
[storage.buckets.source-payloads]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["application/octet-stream"]
